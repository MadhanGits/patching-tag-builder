<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Patching Tag Builder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #f4f4f4;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .output {
      margin-top: 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
      text-align: center;
    }
    .description {
      margin-top: 1rem;
      font-size: 1rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>SQL Patching Tag Builder</h2>
  
  <label for="patchMethod">Patch Method</label>
  <select id="patchMethod">
    <option value="AU">AU - Automatic Update</option>
  </select>

  <label for="patchType">Patch Type</label>
  <select id="patchType">
    <option value="SQL">SQL</option>
  </select>

  <label for="patchWeek">Patch Week</label>
  <select id="patchWeek">
    <option value="0">0 - 2nd Tuesday Week (Dev/Test)</option>
    <option value="1">1 - 1st Prod Week After 2nd Tuesday (Day 0-6)</option>
    <option value="2">2 - 2nd Prod Week After 2nd Tuesday (Day 7-12)</option>
  </select>

  <label for="maintenanceDay">Maintenance Day</label>
  <select id="maintenanceDay">
    <option value="MO">Monday</option>
    <option value="TU">Tuesday</option>
    <option value="WE">Wednesday</option>
    <option value="TH">Thursday</option>
    <option value="FR">Friday</option>
    <option value="SA">Saturday</option>
    <option value="SU">Sunday</option>
  </select>

  <label for="timeBlock">Time Block</label>
  <select id="timeBlock">
    <option value="0001-0400">0001-0400 (12:01 AM - 4:00 AM)</option>
    <option value="0401-0800">0401-0800 (4:01 AM - 8:00 AM)</option>
    <option value="0801-1159">0801-1159 (8:01 AM - 11:59 AM)</option>
    <option value="1201-1600">1201-1600 (12:01 PM - 4:00 PM)</option>
    <option value="1601-2000">1601-2000 (4:01 PM - 8:00 PM)</option>
    <option value="2001-2359">2001-2359 (8:01 PM - 11:59 PM)</option>
  </select>

  <label for="appFamily">App Family (optional)</label>
  <input type="text" id="appFamily" maxlength="5" placeholder="e.g., EPICX">

  <div class="output" id="tagValue">Your tag will appear here...</div>
  <div class="description" id="plainEnglish">Your description will appear here...</div>
</div>

<script>
  const elements = ['patchMethod', 'patchType', 'patchWeek', 'maintenanceDay', 'timeBlock', 'appFamily'];
  elements.forEach(id => document.getElementById(id).addEventListener('input', updateTag));

  function updateTag() {
    const method = document.getElementById('patchMethod').value;
    const type = document.getElementById('patchType').value;
    const week = document.getElementById('patchWeek').value;
    const day = document.getElementById('maintenanceDay').value;
    const block = document.getElementById('timeBlock').value;
    const app = document.getElementById('appFamily').value.trim();

    const tag = app
      ? `<< ${method}-${type}-${week}-${day}-${block}-${app} >>`
      : `<< ${method}-${type}-${week}-${day}-${block} >>`;

    document.getElementById('tagValue').textContent = tag;

    const weekMap = {
      '0': 'during the week of the 2nd Tuesday of the month (for Dev/Test)',
      '1': 'in the 1st production week after the 2nd Tuesday (Days 0–6)',
      '2': 'in the 2nd production week after the 2nd Tuesday (Days 7–12)'
    };

    const dayMap = {
      'MO': 'Monday',
      'TU': 'Tuesday',
      'WE': 'Wednesday',
      'TH': 'Thursday',
      'FR': 'Friday',
      'SA': 'Saturday',
      'SU': 'Sunday'
    };

    const timeMap = {
      '0001-0400': '12:01 AM to 4:00 AM',
      '0401-0800': '4:01 AM to 8:00 AM',
      '0801-1159': '8:01 AM to 11:59 AM',
      '1201-1600': '12:01 PM to 4:00 PM',
      '1601-2000': '4:01 PM to 8:00 PM',
      '2001-2359': '8:01 PM to 11:59 PM'
    };

    let sentence = `Automatic patching for SQL is scheduled ${weekMap[week]}, on ${dayMap[day]}, between ${timeMap[block]}`;
    if (app) {
      sentence += `, for application ${app}`;
    }
    sentence += `.`;

    document.getElementById('plainEnglish').textContent = sentence;
  }
</script>
</body>
</html>
